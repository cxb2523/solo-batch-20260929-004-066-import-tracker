name: tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pinned to 3.10 because requirements_test.txt pins protobuf==3.19.5,
      # which only ships wheels up to CPython 3.10.
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        env:
          RELEASE_VERSION: 0.0.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          python -m pip install -e .

      - name: Run track_imports tests
        run: python -m pytest -q test/test_track_imports.py

      - name: Run full test suite
        run: bash scripts/run_tests.sh

      - name: Upload import trace artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import_trace
          path: test/artifacts/import_trace.html
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov
          if-no-files-found: ignore
